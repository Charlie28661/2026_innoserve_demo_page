<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SafeTwin 展示</title>
<style>
:root{
  --bg:#F2F2F7; --bg-elev:#FFFFFF; --card:rgba(255,255,255,.78); --card-solid:#FFFFFF;
  --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.20); --fill3:rgba(118,118,128,.24);
  --label:#000000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.32); --sep:rgba(60,60,67,.16);
  --thumb:#FFFFFF; --ghost:rgba(60,60,67,.10);
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500; --yellow:#FFCC00; --indigo:#5856D6;
  --purple:#AF52DE; --pink:#FF2D55; --teal:#30B0C7; --mint:#00C7BE; --gray:#8E8E93;
  --accent:var(--blue);
  --shadow:0 1px 0 rgba(0,0,0,.02), 0 10px 30px rgba(0,0,0,.07);
  --shadow-lg:0 20px 60px rgba(0,0,0,.18);
  --r:22px; --fs:1;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --bg-elev:#1C1C1E; --card:rgba(28,28,30,.74); --card-solid:#1C1C1E;
    --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.32); --fill3:rgba(118,118,128,.36);
    --label:#FFFFFF; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.30); --sep:rgba(84,84,88,.55);
    --thumb:#636366; --ghost:rgba(235,235,245,.09);
    --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --yellow:#FFD60A; --indigo:#5E5CE6;
    --purple:#BF5AF2; --pink:#FF375F; --teal:#40C8E0; --mint:#63E6E2; --gray:#98989D;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px rgba(0,0,0,.5);
    --shadow-lg:0 20px 60px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --bg-elev:#1C1C1E; --card:rgba(28,28,30,.74); --card-solid:#1C1C1E;
  --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.32); --fill3:rgba(118,118,128,.36);
  --label:#FFFFFF; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.30); --sep:rgba(84,84,88,.55);
  --thumb:#636366; --ghost:rgba(235,235,245,.09);
  --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --yellow:#FFD60A; --indigo:#5E5CE6;
  --purple:#BF5AF2; --pink:#FF375F; --teal:#40C8E0; --mint:#63E6E2; --gray:#98989D;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px rgba(0,0,0,.5);
  --shadow-lg:0 20px 60px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro TC","PingFang TC","Segoe UI Variable Text","Segoe UI","Microsoft JhengHei UI","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  font-size:calc(15px * var(--fs)); line-height:1.4; -webkit-font-smoothing:antialiased;
  overflow-x:hidden; transition:background .4s;
}
.num,.tab{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
/* 背景光暈 */
#glow{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:1;transition:opacity .6s}
#glow i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.14}
#glow i:nth-child(1){background:var(--accent);left:-12vmax;top:-14vmax}
#glow i:nth-child(2){background:var(--pink);right:-16vmax;top:12vmax;opacity:.08}
#glow i:nth-child(3){background:var(--teal);left:24vmax;bottom:-24vmax;opacity:.09}
body.noglow #glow{opacity:0}
.glass{background:var(--card);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px)}
body.noglass .glass{background:var(--card-solid);backdrop-filter:none;-webkit-backdrop-filter:none}
.card,.rcard{background:var(--card-solid)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--accent) 24%,transparent)}
.sheet .body{scrollbar-width:thin;scrollbar-color:var(--fill3) transparent}
.avatar svg{width:30px;height:30px;fill:currentColor}

/* 導覽列 */
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:12px 24px;border-bottom:.5px solid var(--sep)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.appicon{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--indigo)));box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 40%,transparent)}
.appicon svg{width:22px;height:22px}
.brand .t{font-weight:700;font-size:calc(19px*var(--fs));letter-spacing:-.2px}
.brand .s{font-size:calc(12px*var(--fs));color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;user-select:none}
.seg button{position:relative;z-index:1;border:0;background:none;padding:6px 14px;font-size:calc(13px*var(--fs));font-weight:500;border-radius:7px;cursor:pointer;white-space:nowrap;transition:color .2s}
.seg button[aria-pressed="true"]{font-weight:600}
.seg .thumb{position:absolute;z-index:0;top:2px;bottom:2px;left:2px;border-radius:7px;background:var(--thumb);
  box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transition:transform .35s cubic-bezier(.3,1.3,.5,1),width .35s}
.seg.big button{padding:7px 18px;font-size:calc(14px*var(--fs))}
.iconbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--fill);display:grid;place-items:center;cursor:pointer;transition:transform .15s,background .2s;flex:none}
.iconbtn:hover{background:var(--fill2)}
.iconbtn:active{transform:scale(.9)}
.iconbtn svg{width:18px;height:18px;fill:var(--accent)}
.iconbtn.primary{background:var(--accent)}
.iconbtn.primary svg{fill:#fff}
.tools{display:flex;gap:8px;align-items:center}

/* 主體 */
main{position:relative;z-index:1;max-width:1560px;margin:0 auto;padding:22px 24px 40px}
.scene{display:none}
.scene.on{display:block;animation:sceneIn .5s cubic-bezier(.2,.9,.3,1)}
@keyframes sceneIn{from{opacity:0;transform:translateY(10px) scale(.995)}}
body.reduce .scene.on{animation:none}
.card{border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px}
.h1{font-size:calc(30px*var(--fs));font-weight:700;letter-spacing:-.5px;margin:0 0 16px}
.lead{color:var(--label2);margin:0 0 18px;font-size:calc(15px*var(--fs))}
.caption{font-size:calc(12px*var(--fs));color:var(--label2)}
.sectitle{font-size:calc(13px*var(--fs));font-weight:600;color:var(--label2);text-transform:none;letter-spacing:.2px;margin:0 0 10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-weight:600;font-size:calc(13px*var(--fs));
  background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}

/* 旁白 */
.narr{display:flex;align-items:center;gap:14px;margin-bottom:18px;padding:14px 18px;border-radius:var(--r);min-height:58px}
.narr .stepno{flex:none;font-weight:700;color:#fff;background:var(--accent);border-radius:999px;padding:3px 11px;font-size:calc(13px*var(--fs))}
.narr .txt{font-size:calc(17px*var(--fs));font-weight:500;letter-spacing:-.1px}
.narr .txt b{font-weight:700}
.narr.fade .txt{animation:txtIn .45s ease}
@keyframes txtIn{from{opacity:0;transform:translateY(4px)}}
body.nonarr .narr{display:none}

/* 場景一：重識別 */
.reid{display:grid;grid-template-columns:minmax(300px,360px) 1fr;gap:20px;align-items:start}
.leftcol{display:grid;gap:20px}
.att-top{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.avatar{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:24px;color:#fff;
  background:linear-gradient(160deg,#A2A2A8,#6E6E73);position:relative;transition:background .5s}
.avatar.found{background:linear-gradient(160deg,var(--red),color-mix(in srgb,var(--red) 60%,#000))}
.avatar.found::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--red);animation:ring 1.6s ease-out infinite}
@keyframes ring{from{opacity:.9;transform:scale(.92)}to{opacity:0;transform:scale(1.35)}}
.att-top .t{font-weight:700;font-size:calc(17px*var(--fs))}
.att-top .s{font-size:calc(12.5px*var(--fs));color:var(--label2)}
.chips{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.chip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--fill);transition:background .35s,transform .35s cubic-bezier(.3,1.5,.5,1),opacity .35s}
.chip .ci{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--fill2);color:var(--label2);transition:all .35s}
.chip .cl{flex:1;color:var(--label2)}
.chip .cv{font-weight:600;filter:blur(6px);opacity:.5;transition:filter .45s,opacity .45s}
.chip.on{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.chip.on .ci{background:var(--accent);color:#fff}
.chip.on .cv{filter:none;opacity:1}
.chip.on .cl{color:var(--label)}
.chip.pop{transform:scale(1.04)}
.want{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:calc(13px*var(--fs));color:var(--label2)}
.want span.q{padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--label);font-weight:500}
.dots{display:flex;gap:6px;margin-top:16px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--fill3);transition:all .3s}
.dots i.on{background:var(--accent);width:20px;border-radius:4px}

.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.rcard{position:relative;border-radius:var(--r);box-shadow:var(--shadow);padding:16px 16px 14px;overflow:hidden;transition:transform .4s cubic-bezier(.3,1.3,.5,1),box-shadow .4s}
.rcard.hit{box-shadow:0 0 0 2px var(--red),var(--shadow)}
.rhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rhead .swc{width:10px;height:10px;border-radius:3px;background:var(--tint);flex:none}
.rhead .nm{font-weight:650;font-size:calc(15px*var(--fs))}
.rhead .sb{font-size:calc(12px*var(--fs));color:var(--label2)}
.rhead .tag{margin-left:auto;font-size:calc(11px*var(--fs));font-weight:600;padding:2px 8px;border-radius:6px;background:var(--fill);color:var(--label2)}
.rcard canvas{display:block;width:100%;border-radius:12px;background:var(--fill)}
.rcount{display:flex;align-items:baseline;gap:8px;margin-top:12px}
.rcount .big{font-size:calc(34px*var(--fs));font-weight:700;letter-spacing:-1px;line-height:1}
.rcount .of{color:var(--label2);font-size:calc(13px*var(--fs))}
.rbar{height:5px;border-radius:3px;background:var(--fill);margin-top:10px;overflow:hidden}
.rbar i{display:block;height:100%;width:100%;background:var(--tint);border-radius:3px;transition:width .8s cubic-bezier(.2,.9,.3,1)}
.verdict{margin-top:12px;min-height:26px;opacity:0;transform:translateY(6px);transition:opacity .45s,transform .45s}
.verdict.on{opacity:1;transform:none}
.verdict .d{margin-top:8px;font-size:calc(13px*var(--fs));color:var(--label2)}
.verdict .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:8px;font-size:calc(13.5px*var(--fs))}
.verdict .kv span:nth-child(odd){color:var(--label2)}
.verdict .kv span:nth-child(even){font-weight:650;color:var(--red)}
.spread{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.spread span{font-size:calc(12px*var(--fs));padding:2px 8px;border-radius:999px;background:var(--fill)}

.pop .row{display:grid;grid-template-columns:minmax(90px,130px) 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:.5px solid var(--sep)}
.pop .row:first-of-type{border-top:0}
.pop .nm{font-size:calc(13px*var(--fs))}
.pop .nm small{display:block;color:var(--label2);font-size:calc(11px*var(--fs))}
.pop .bar{height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.pop .bar i{display:block;height:100%;border-radius:4px;background:var(--tint);min-width:2px;transition:width .9s cubic-bezier(.2,.9,.3,1)}
.pop .v{font-weight:650;font-size:calc(13px*var(--fs));text-align:right;min-width:74px}
.pop .v small{display:block;font-weight:400;color:var(--label2);font-size:calc(11px*var(--fs))}

/* 通知橫幅 */
.toast{position:fixed;z-index:60;left:50%;top:14px;width:min(560px,calc(100% - 32px));transform:translate(-50%,-140%);
  border-radius:24px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow-lg);transition:transform .6s cubic-bezier(.3,1.25,.4,1)}
.toast.on{transform:translate(-50%,0)}
.toast .appicon{width:38px;height:38px}
.toast .tt{font-weight:650;font-size:calc(14px*var(--fs))}
.toast .tt small{font-weight:400;color:var(--label2);margin-left:6px}
.toast .tb{font-size:calc(14px*var(--fs))}

/* 場景二、三：圖 */
.chartwrap{display:grid;grid-template-columns:1fr minmax(300px,380px);gap:20px;align-items:start}
svg.chart{width:100%;height:auto;display:block;overflow:visible;touch-action:none}
svg.chart text{fill:var(--label2);font-size:13px;font-family:inherit;paint-order:stroke;stroke:var(--bg-elev);stroke-width:4px;stroke-linejoin:round}
svg.chart #cTag{stroke:none}
svg.chart .axis line,svg.chart .grid line{stroke:var(--sep)}
svg.chart .grid line{stroke-dasharray:2 4}
svg.chart .ttl{fill:var(--label);font-weight:600;font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:calc(13px*var(--fs));color:var(--label2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.legend i.line{width:18px;height:3px;border-radius:2px}
.legend i.dash{width:18px;height:0;border-top:2px dashed var(--c);background:none;border-radius:0}
.readout .bigeps{font-size:calc(46px*var(--fs));font-weight:700;letter-spacing:-1.5px;line-height:1.05}
.readout .bigeps small{font-size:.45em;color:var(--label2);font-weight:600;letter-spacing:0;margin-left:6px}
.metric{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 0;border-top:.5px solid var(--sep)}
.metric .k{color:var(--label2);font-size:calc(13.5px*var(--fs))}
.metric .k small{display:block;font-size:calc(11.5px*var(--fs))}
.metric .v{font-weight:650;font-size:calc(19px*var(--fs));text-align:right}
.metric .v small{display:block;font-weight:400;font-size:calc(11.5px*var(--fs));color:var(--label2)}
.measured{margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--fill)}
.measured .mrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:calc(13.5px*var(--fs))}
.measured .mrow i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.measured .mrow b{font-weight:650}
.note{font-size:calc(12px*var(--fs));color:var(--label2);margin-top:10px}

/* iOS 滑桿 */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p),var(--fill3) var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--fill3)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-11px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.06);cursor:grab}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.18)}

/* 設定面板 */
.sheet{position:fixed;z-index:50;top:10px;right:10px;bottom:10px;width:min(400px,calc(100% - 20px));border-radius:28px;box-shadow:var(--shadow-lg);
  transform:translateX(calc(100% + 30px));transition:transform .55s cubic-bezier(.3,1.1,.4,1);display:flex;flex-direction:column;overflow:hidden}
.sheet.on{transform:none}
.sheet header{display:flex;align-items:center;padding:16px 18px 8px}
.sheet header .t{font-weight:700;font-size:calc(22px*var(--fs));flex:1;letter-spacing:-.3px}
.sheet .done{border:0;background:none;color:var(--accent);font-weight:600;font-size:calc(16px*var(--fs));cursor:pointer;padding:6px}
.sheet .body{overflow:auto;padding:4px 16px 24px;flex:1}
.grp{margin:16px 0 0}
.grp h4{margin:0 0 6px 14px;font-size:calc(12.5px*var(--fs));font-weight:500;color:var(--label2);text-transform:uppercase;letter-spacing:.3px}
.grp h4 small{text-transform:none;letter-spacing:0;margin-left:6px;color:var(--accent)}
.list{background:var(--bg-elev);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;min-height:46px;padding:7px 14px;position:relative}
.item+.item::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:.5px solid var(--sep)}
.item .l{flex:1;font-size:calc(15px*var(--fs))}
.item .val{color:var(--label2);font-size:calc(14px*var(--fs));min-width:52px;text-align:right}
.item.col{flex-direction:column;align-items:stretch;gap:2px;padding:9px 14px}
.item.col .top{display:flex;justify-content:space-between}
.item select{font:inherit;font-size:calc(14px*var(--fs));color:var(--accent);background:transparent;border:0;text-align:right;cursor:pointer;max-width:55%}
.item select option{color:initial}
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:16px;background:var(--fill3);transition:background .25s}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.sw input:checked+span{background:var(--green)}
.sw input:checked+span::after{transform:translateX(20px)}
.swatches{display:flex;gap:10px}
.swatches button{width:26px;height:26px;border-radius:50%;border:0;cursor:pointer;background:var(--c);box-shadow:0 0 0 0 var(--c);transition:box-shadow .2s,transform .2s}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg-elev),0 0 0 4px var(--c)}
.swatches button:active{transform:scale(.88)}
.item .seg{flex:none}
.item .seg button{padding:5px 10px}
.reset{display:block;width:100%;margin-top:18px;border:0;border-radius:14px;background:var(--bg-elev);color:var(--red);font-size:calc(15px*var(--fs));padding:13px;cursor:pointer}
.keys{margin-top:16px;font-size:calc(12.5px*var(--fs));color:var(--label2);display:grid;grid-template-columns:auto 1fr;gap:6px 12px;padding:0 6px}
kbd{font-family:inherit;font-size:.9em;padding:1px 7px;border-radius:6px;background:var(--fill);border:.5px solid var(--sep);color:var(--label)}
.scrim{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .4s}
.scrim.on{opacity:1;pointer-events:auto}

footer{position:relative;z-index:1;max-width:1560px;margin:0 auto;padding:0 24px 28px;font-size:calc(12px*var(--fs));color:var(--label2)}
body.reduce,body.reduce *{transition-duration:0s!important;animation-duration:0s!important}

.reid>*,.chartwrap>*,.leftcol>*{min-width:0}
@media (max-width:600px){ #bBack,#bFwd,#bFull{display:none} .tools{gap:6px} }
@media (max-width:1020px){
  .reid,.chartwrap{grid-template-columns:1fr}
  .nav{flex-wrap:wrap;padding:10px 16px}
  .nav .seg.big{order:3;width:100%}

class DotField {
  constructor(canvas, n, tint, seed) {
    this.cv = canvas; this.ctx = canvas.getContext("2d"); this.n = n; this.tint = tint;
    this.rand = mulberry(seed); this.count = n; this.from = n; this.to = n; this.t0 = 0; this.dur = 0;
    this.focus = 0; this.focusFrom = 0; this.focusTo = 0; this.found = false; this.verdictColor = tint;
  }
  layout() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = this.cv.clientWidth, h = S.fieldH;
    this.cv.style.height = h + "px"; this.cv.width = Math.round(w * dpr); this.cv.height = Math.round(h * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0); this.w = w; this.h = h;
    this.per = S.perDot; this.m = Math.ceil(this.n / this.per);
    const pad = 8, W = w - 2 * pad, H = h - 2 * pad;
    const cols = Math.max(1, Math.ceil(Math.sqrt(this.m * W / H))), rows = Math.ceil(this.m / cols);
    this.cell = Math.min(W / cols, H / rows); this.cols = cols;
    this.ox = pad + (W - cols * this.cell) / 2; this.oy = pad + (H - rows * this.cell) / 2;
    // rank → 格子位置（隨機排列，位置僅為示意）
    const r = mulberry(this.n * 7 + 3), perm = new Uint32Array(this.m);
    for (let i = 0; i < this.m; i++) perm[i] = i;
    for (let i = this.m - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
    this.perm = perm; this.delay = new Float32Array(this.m); for (let i = 0; i < this.m; i++) this.delay[i] = r();
    this.draw(performance.now());
  }
  setCount(c, animate) {
    const now = performance.now();
    this.from = this.curCount(now); this.to = c; this.t0 = now; this.dur = animate ? T(1.1) : 0;
    this.focusFrom = this.focus; this.focusTo = c <= S.focusAt ? 1 : 0;
    this.count = c;
  }
  curCount(now) { const p = this.dur ? Math.min(1, (now - this.t0) / this.dur) : 1; return this.from + (this.to - this.from) * ease(p); }
  progress(now) { return this.dur ? Math.min(1, (now - this.t0) / this.dur) : 1; }
  active(now) { return this.progress(now) < 1 || (this.found && !S.reduce); }
  draw(now) {
    const ctx = this.ctx, p = this.progress(now), e = ease(p);
    ctx.clearRect(0, 0, this.w, this.h);
    const tint = cssv(this.tint);
    const litFrom = Math.ceil(this.from / this.per), litTo = Math.ceil(this.to / this.per);
    this.focus = this.focusFrom + (this.focusTo - this.focusFrom) * e;
    const s = this.cell * S.dotSize, off = (this.cell - s) / 2, dim = 1 - this.focus * 0.92;
    const lo = Math.min(litFrom, litTo), hi = Math.max(litFrom, litTo), shrinking = litTo < litFrom;
    if (S.ghost) { ctx.globalAlpha = 1; ctx.fillStyle = cssv("--ghost"); for (let k = 0; k < this.m; k++) this.rect(k, s, off); }
    ctx.fillStyle = tint; ctx.globalAlpha = dim;
    for (let k = 0; k < lo; k++) this.rect(k, s, off);
    if (hi > lo) {  // 轉換中的點：每點有自己的隨機延遲，逐一淡出（或倒退時淡入）
      const B = 8, buckets = Array.from({length: B}, () => []);
      for (let k = lo; k < hi; k++) {
        const local = Math.min(1, Math.max(0, (p - this.delay[k] * 0.65) / 0.35));
        const a = shrinking ? 1 - local : local;
        if (a > 0.02) buckets[Math.min(B - 1, Math.floor(a * B))].push(k);
      }
      buckets.forEach((ks, b) => { if (!ks.length) return; ctx.globalAlpha = (b + 0.5) / B * dim; for (const k of ks) this.rect(k, s, off); });
    }
    ctx.globalAlpha = 1;
    if (this.focus > 0.01) this.drawFocus(now, Math.round(this.to), e);
  }
  rect(k, s, off) { const i = this.perm[k], x = this.ox + (i % this.cols) * this.cell + off, y = this.oy + Math.floor(i / this.cols) * this.cell + off; this.ctx.fillRect(x, y, s, s); }
  drawFocus(now, c, e) {
    const ctx = this.ctx, cx = this.w / 2, cy = this.h / 2, f = this.focus;
    const col = cssv(this.verdictColor);
    if (c === 0) {
      ctx.globalAlpha = f; ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
      ctx.beginPath(); ctx.arc(cx, cy, Math.min(this.h * 0.28, 40) * (0.7 + 0.3 * f), 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = col; ctx.font = `600 ${Math.round(13 * S.fontScale / 100)}px -apple-system,"Segoe UI","Microsoft JhengHei",sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("查無此人", cx, cy); ctx.globalAlpha = 1; return;
    }
    const R = Math.min(this.w, this.h) * 0.44;
    const rad = Math.max(2.5, Math.min(c === 1 ? 16 : 11, R / Math.sqrt(c) * 0.62));
    const step = rad * 2.25 / Math.sqrt(Math.PI) * 1.05;
    for (let i = 0; i < c; i++) {
      const a = i * 2.39996, r = step * Math.sqrt(i + 0.5);
      const appear = Math.min(1, Math.max(0, f * 1.6 - (i / Math.max(c, 1)) * 0.6));
      ctx.globalAlpha = appear; ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(cx + r * Math.cos(a), cy + r * Math.sin(a), rad * (0.4 + 0.6 * ease(appear)), 0, Math.PI * 2); ctx.fill();
    }
    if (c === 1 && this.found) {
      const ph = ((now / 1000) % 1.6) / 1.6;
      ctx.globalAlpha = (1 - ph) * f; ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, rad + 4 + ph * 22, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = f; ctx.fillStyle = "#fff";  // 人形
      ctx.beginPath(); ctx.arc(cx, cy - rad * 0.28, rad * 0.32, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx, cy + rad * 0.42, rad * 0.55, rad * 0.32, 0, Math.PI, 0); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

  },
  readout(e) {
    const p = S.prior / 100, b = bound(e), post = posterior(p, e);
    const m = MEASURED_EPS.find((v) => Math.abs(Math.log(v / e)) < 0.01);
    let meas;
    if (m != null) {
      const gr = DATA.groups[EPS_GROUP[m]];
      const rows = Object.entries(ATK).filter(([id]) => S["atk_" + id] && gr[ATK[id].g]).map(([id, a]) =>
        `<div class="mrow" style="--c:var(${a.c})"><i></i><span>${a.name}</span><b class="num">${f3(gr[a.g].mean)}</b></div>`).join("");
      const ok = Object.entries(ATK).filter(([id]) => S["atk_" + id] && gr[ATK[id].g]).every(([, a]) => gr[a.ok]);
      meas = `<div class="measured">${rows}<div style="margin-top:8px"><span class="pill" style="--c:var(${ok ? "--green" : "--red"})">${ok ? "攻擊皆未成功" : "有攻擊成功"}</span></div></div>
        <div class="note">實測 AUC，三次執行平均；0.5 等於隨機猜。</div>`;
    } else {
      meas = `<div class="measured"><div class="caption">這個 ε 沒有實測，只有理論上限。</div></div>`;
    }
    $("#epsBig").innerHTML = `ε = ${e < 10 ? e.toFixed(e === Math.round(e * 10) / 10 ? 1 : 2) : e.toFixed(1)}`;
    $("#epsDyn").innerHTML = `
      <div class="metric"><span class="k">攻擊 AUC 理論上限</span><span class="v num">${b.toFixed(3)}</span></div>
      ${S.post ? `<div class="metric"><span class="k">先驗 ${S.prior}% → 最多</span><span class="v num">${pct(post)}</span></div>` : ""}
      ${meas}`;
  },
  play() {
    setPlaying(true); const g = this.g;
    const lo = S.xLog === "log" ? Math.log10(0.1) : 0.05, hi = S.xLog === "log" ? Math.log10(g.xmax) : g.xmax;
    const conv = (u) => S.xLog === "log" ? Math.pow(10, u) : u;
    let u = S.eps >= g.xmax * 0.98 ? lo : (S.xLog === "log" ? Math.log10(S.eps) : S.eps), last = performance.now(), hold = 0;
    const stops = MEASURED_EPS.filter((m) => m <= g.xmax).map((m) => S.xLog === "log" ? Math.log10(m) : m);
    const rate = (hi - lo) / (9 / S.speed);
    const tick = (now) => {
      if (!playing) return;
      const dt = (now - last) / 1000; last = now;
      if (hold > 0) { hold -= dt; this.raf = requestAnimationFrame(tick); return; }
      const nu = u + rate * dt, st = stops.find((s) => u < s && nu >= s);
      if (st != null) { u = st; this.setEps(conv(u), true); hold = S.dwell; }
      else { u = nu; if (u >= hi) { u = hi; this.setEps(conv(u), true); if (S.loop) { u = lo; hold = S.dwell; } else { setPlaying(false); return; } } else this.setEps(conv(u), true); }
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  },
  stop() { cancelAnimationFrame(this.raf); setPlaying(false); },
  next() { this.stop(); const nxt = MEASURED_EPS.find((m) => m > S.eps + 1e-6 && m <= this.g.xmax); this.setEps(nxt ?? this.g.xmax, true); },
  prev() { this.stop(); const pv = [...MEASURED_EPS].reverse().find((m) => m < S.eps - 1e-6); this.setEps(pv ?? 0.1, true); },
  restart() { this.stop(); this.drawn = false; this.render(); this.setEps(0.1, true); },
};

/* ---------------- 場景三：隱私 × 效用 ---------------- */
const PX = {R2: {g: "R2_auc", name: "R2 成員推論 AUC", auc: true}, R2b_cal: {g: "R2b_cal_auc", name: "R2b 校正距離 AUC", auc: true},
  R2c: {g: "R2c_auc", name: "R2c Shadow model AUC", auc: true}, R1: {g: "R1_reid_rate_k4", name: "R1 重識別率（k=4，確切年齡）", auc: false}};
const PY = {lift: {g: "U1_retained_lift", name: "效用保留"}, prauc: {g: "U1_pr_auc", name: "PR-AUC"}, top: {g: "U1_top200_precision", name: "前 200 名命中率"}};
const GNAME = {naive: "天真做法", kanon_k5: "k-anon k=5", kanon_k10: "k-anon k=10", "dpsynth_eps0.5": "DP ε=0.5", dpsynth_eps2: "DP ε=2", dpsynth_eps8: "DP ε=8", "pasynth_eps0.5": "用途感知 ε=0.5"};
const Par = {
  revealed: 99, before: 99, timer: null,
  order() { return ["naive"].concat(S.incKanon ? ["kanon_k5", "kanon_k10"] : [], ["dpsynth_eps8", "dpsynth_eps2", "dpsynth_eps0.5"], S.incPA ? ["pasynth_eps0.5"] : []); },
  render() {
    const root = $("#parChart"); root.innerHTML = "";
    const px = PX[S.px], py = PY[S.py], G = DATA.groups, order = this.order();
    const pts = order.filter((g) => G[g] && G[g][px.g] && G[g][py.g]);
    const missing = order.filter((g) => !pts.includes(g));
    const m = {l: 70, r: 30, t: 24, b: 58}, W = 800, H = 470;
    const xs = pts.flatMap((g) => [G[g][px.g].min, G[g][px.g].max]);
    let x0, x1; if (px.auc) { x0 = 0.45; x1 = Math.max(0.6, ...xs) + 0.03; } else { x0 = 0; x1 = Math.max(0.01, ...xs) * 1.12; }
    const ys = pts.flatMap((g) => [G[g][py.g].min, G[g][py.g].max]).concat(G.real ? [G.real[py.g].mean] : []);
    const y0 = Math.max(0, Math.min(...ys) - 0.08), y1 = Math.min(1.05, Math.max(...ys) + 0.06);
    const X = (v) => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r), Y = (v) => m.t + (1 - (v - y0) / (y1 - y0)) * (H - m.t - m.b);
    const grid = svg("g", {class: "grid"}, root), axis = svg("g", {class: "axis"}, root);
    const nice = (a, b, n) => { const s = Math.pow(10, Math.floor(Math.log10((b - a) / n))); const st = [1, 2, 5, 10].map((k) => k * s).find((k) => (b - a) / k <= n); const out = []; for (let v = Math.ceil(a / st) * st; v <= b + 1e-9; v += st) out.push(+v.toFixed(6)); return out; };
    const fx = (v) => px.auc ? v.toFixed(2) : (v * 100).toFixed(v < 0.1 ? 0 : 0) + "%";
    nice(x0, x1, 7).forEach((v) => { svg("line", {x1: X(v), x2: X(v), y1: m.t, y2: H - m.b}, grid); svg("text", {x: X(v), y: H - m.b + 20, "text-anchor": "middle", class: "tab"}, axis).textContent = fx(v); });
    nice(y0, y1, 6).forEach((v) => { svg("line", {x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v)}, grid); svg("text", {x: m.l - 10, y: Y(v) + 4, "text-anchor": "end", class: "tab"}, axis).textContent = S.py === "prauc" ? v.toFixed(2) : Math.round(v * 100) + "%"; });
    svg("text", {x: (m.l + W - m.r) / 2, y: H - 12, "text-anchor": "middle", class: "ttl"}, axis).textContent = px.name + "（越左越安全）";
    svg("text", {x: 18, y: (m.t + H - m.b) / 2, "text-anchor": "middle", class: "ttl", transform: `rotate(-90 18 ${(m.t + H - m.b) / 2})`}, axis).textContent = py.name + "（越高越好）";
    if (S.zones) {
      if (px.auc) { svg("rect", {x: m.l, y: m.t, width: Math.max(0, X(0.55) - m.l), height: H - m.t - m.b, fill: cssv("--green"), opacity: 0.07}, root);
        svg("line", {x1: X(0.55), x2: X(0.55), y1: m.t, y2: H - m.b, stroke: cssv("--orange"), "stroke-dasharray": "6 5", "stroke-width": 1.5}, root);
        svg("text", {x: X(0.55) - 8, y: m.t + 16, "text-anchor": "end", "font-size": 12, fill: cssv("--green"), "font-weight": 600}, root).textContent = "攻擊未成功區"; }
      if (S.py === "lift" && 0.5 > y0) { svg("line", {x1: m.l, x2: W - m.r, y1: Y(0.5), y2: Y(0.5), stroke: cssv("--orange"), "stroke-dasharray": "6 5", "stroke-width": 1.5}, root);
        svg("text", {x: W - m.r - 6, y: Y(0.5) - 6, "text-anchor": "end", "font-size": 12, fill: cssv("--orange")}, root).textContent = "實用門檻 0.5"; }
      if (S.py === "prauc" && G.naive && G.naive.pr_auc_noskill > y0) { const v = G.naive.pr_auc_noskill; svg("line", {x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: cssv("--label3"), "stroke-width": 1.5}, root);
        svg("text", {x: W - m.r - 6, y: Y(v) - 6, "text-anchor": "end", "font-size": 12}, root).textContent = `全猜多數類 ${v.toFixed(3)}`; }
    }
    const occupied = [];
    if (G.real && G.real[py.g]) { const v = G.real[py.g].mean; occupied.push({x0: m.l + 8, x1: m.l + 250, y0: Y(v) - 22, y1: Y(v) - 2});
      svg("line", {x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: cssv("--gray"), "stroke-width": 1.5, "stroke-dasharray": "2 4"}, root);
      svg("text", {x: m.l + 8, y: Y(v) - 7, "font-size": 12, fill: cssv("--label2")}, root).textContent = "原始資料（上限）"; }
    const layer = svg("g", {}, root), labels = [];
    pts.forEach((g, i) => {
      const gx = G[g][px.g], gy = G[g][py.g], col = cssv(TINT[g]), on = i < this.revealed, fresh = on && i >= this.before;
      const gg = svg("g", {}, layer); gg.style.transition = `opacity ${T(0.5)}ms, transform ${T(0.6)}ms cubic-bezier(.3,1.3,.5,1)`;
      gg.style.transformOrigin = `${X(gx.mean)}px ${Y(gy.mean)}px`; gg.style.opacity = on && !fresh ? 1 : 0; gg.style.transform = on && !fresh ? "scale(1)" : "scale(.4)";
      if (fresh) requestAnimationFrame(() => requestAnimationFrame(() => { gg.style.opacity = 1; gg.style.transform = "scale(1)"; }));
      if (S.range3 && gx.n > 1) { svg("line", {x1: X(gx.min), x2: X(gx.max), y1: Y(gy.mean), y2: Y(gy.mean), stroke: col, "stroke-width": 2, opacity: .5}, gg);
        svg("line", {x1: X(gx.mean), x2: X(gx.mean), y1: Y(gy.min), y2: Y(gy.max), stroke: col, "stroke-width": 2, opacity: .5}, gg); }
      const released = g === "dpsynth_eps0.5";
      if (released) svg("circle", {cx: X(gx.mean), cy: Y(gy.mean), r: 15, fill: "none", stroke: col, "stroke-width": 2, opacity: .45}, gg);
      if (g.startsWith("pa")) svg("rect", {x: X(gx.mean) - 7, y: Y(gy.mean) - 7, width: 14, height: 14, transform: `rotate(45 ${X(gx.mean)} ${Y(gy.mean)})`, fill: col, stroke: cssv("--bg-elev"), "stroke-width": 2}, gg);
      else svg("circle", {cx: X(gx.mean), cy: Y(gy.mean), r: 8, fill: col, stroke: cssv("--bg-elev"), "stroke-width": 2}, gg);
      labels.push({gg, x: X(gx.mean), y: Y(gy.mean), text: GNAME[g] + (released ? "・釋出" : "")});
    });
    if (S.labels) {  // 標籤避讓：依序嘗試上下位移，避開已放的標籤與所有點
      const tw = (t) => [...t].reduce((a, ch) => a + (/[\u0000-\u024f]/.test(ch) ? 7.6 : 13.2), 0);
      const boxes = labels.map((l) => ({x0: l.x - 10, x1: l.x + 10, y0: l.y - 10, y1: l.y + 10})).concat(occupied);
      const hit = (b) => boxes.some((o) => b.x0 < o.x1 && b.x1 > o.x0 && b.y0 < o.y1 && b.y1 > o.y0);
      for (const l of [...labels].sort((a, b) => a.y - b.y)) {
        const w = tw(l.text), right = l.x + 14 + w < W - m.r;
        let best = null;
        for (const dy of [-6, 10, -22, 26, -38, 42, -54, 58]) {
          const x0 = right ? l.x + 14 : l.x - 14 - w, b = {x0, x1: x0 + w, y0: l.y + dy - 13, y1: l.y + dy + 3};
          if (!hit(b)) { best = {b, dy}; break; }
        }
        best = best || {b: {x0: right ? l.x + 14 : l.x - 14 - w, x1: 0, y0: 0, y1: 0}, dy: -6};
        boxes.push(best.b);
        const t = svg("text", {x: right ? l.x + 14 : l.x - 14, y: l.y + best.dy, "text-anchor": right ? "start" : "end", "font-size": 13, "font-weight": 600, fill: cssv("--label")}, l.gg);
        t.textContent = l.text;
        if (Math.abs(best.dy) > 12) svg("line", {x1: l.x + (right ? 9 : -9), y1: l.y, x2: right ? l.x + 13 : l.x - 13, y2: l.y + best.dy - 4, stroke: cssv("--label3"), "stroke-width": 1}, l.gg);
      }
    }
    $("#parLegend").innerHTML = "<span>左上角最好：攻擊不成功、資料仍好用</span>";
    this.pts = pts; this.before = this.revealed; this.readout();
  },
  readout() {
    const px = PX[S.px], py = PY[S.py], G = DATA.groups, shown = this.pts.slice(0, this.revealed);
    const fv = (v, auc) => auc ? f3(v) : pct(v, 2), fy = (v) => S.py === "prauc" ? f3(v) : pct(v);
    const n = $("#parNarr"); const last = shown[shown.length - 1];
    $("#parStepNo").textContent = this.revealed >= this.pts.length ? "全部" : `${Math.min(this.revealed, this.pts.length)} / ${this.pts.length}`;
    if (!last) { $("#parTxt").textContent = "按播放，依序加入每種處理方式。"; return; }
    if (this.revealed >= this.pts.length && this.pts.includes("dpsynth_eps0.5")) {
      const r = G["dpsynth_eps0.5"];
      $("#parTxt").innerHTML = `依事先寫定的規則選中 <b>DP ε=0.5</b> 並釋出：${px.auc ? "AUC" : "重識別率"} <b class="num">${fv(r[px.g].mean, px.auc)}</b>，${py.name} <b class="num">${fy(r[py.g].mean)}</b>`;
      n.classList.remove("fade"); return;
    }
    n.classList.remove("fade"); void n.offsetWidth; n.classList.add("fade");
    const gx = G[last][px.g], gy = G[last][py.g];
    const verdict = px.auc ? (G[last][{R2: "R2_attack_unsuccessful", R2b_cal: "R2b_cal_attack_unsuccessful", R2c: "R2c_attack_unsuccessful"}[S.px]] ? "攻擊未成功" : "攻擊成功") : "";
    $("#parTxt").innerHTML = `<b>${GNAME[last]}</b>：${px.auc ? "AUC" : "重識別率"} <b class="num">${fv(gx.mean, px.auc)}</b>${verdict ? `（${verdict}）` : ""}，${py.name} <b class="num">${fy(gy.mean)}</b>`;
  },
  play() { setPlaying(true); clearTimeout(this.timer); if (this.revealed >= this.pts.length) { this.revealed = 0; this.render(); }
    const tick = () => { if (!playing) return; if (this.revealed < this.pts.length) { this.revealed++; this.render(); this.timer = setTimeout(tick, T(0.6) + S.dwell * 1000); }
      else if (S.loop) { this.timer = setTimeout(() => { this.revealed = 0; this.render(); this.timer = setTimeout(tick, 600); }, S.dwell * 1500); } else setPlaying(false); };
    this.timer = setTimeout(tick, 400); },
  stop() { clearTimeout(this.timer); setPlaying(false); },
  next() { this.stop(); if (this.revealed < this.pts.length) { this.revealed++; this.render(); } },
  prev() { this.stop(); if (this.revealed > 0) { this.revealed = Math.min(this.revealed, this.pts.length) - 1; this.render(); } },
  restart() { this.stop(); this.revealed = 0; this.render(); },
};

/* ---------------- 組裝 ---------------- */
function showScene(s, auto = true) {
  cur().stop(); scene = s; save(); markSceneTags();
  document.querySelectorAll(".scene").forEach((e) => e.classList.toggle("on", e.id === "scene-" + s));
  $("#sceneSeg")._set ? $("#sceneSeg")._set(s) : null;
  if (s === "reid") { requestAnimationFrame(() => Reid.relayout()); }
  if (s === "eps") { Eps.drawn = false; Eps.render(); }
  if (s === "pareto") { Par.render(); }
  if (auto && S.autoplay) setTimeout(() => cur().play(), 450);
}
function rebuildAll() { Reid.build(); Eps.drawn = false; Eps.render(); Par.render(); requestAnimationFrame(() => document.querySelectorAll(".seg").forEach(segThumb)); }

(function init() {
  applyLook();
  const seg = $("#sceneSeg");
  const set = (v) => { seg.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === v)); segThumb(seg); };
  seg._set = set;
  seg.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b && b.dataset.v !== scene) { set(b.dataset.v); showScene(b.dataset.v); } });
  buildSettings();
  Reid.build();
  showScene(scene, false); set(scene);
  $("#bPlay").onclick = togglePlay;
  const fwd = () => { if (scene === "reid") { Reid.stop(); Reid.next(); } else cur().next(); };
  const back = () => { if (scene === "reid") { Reid.stop(); Reid.prev(); } else cur().prev(); };
  const openSheet = (o) => { $("#sheet").classList.toggle("on", o); $("#scrim").classList.toggle("on", o); if (o) requestAnimationFrame(() => document.querySelectorAll("#sheet .seg").forEach(segThumb)); };
  $("#bSet").onclick = () => openSheet(!$("#sheet").classList.contains("on"));
  $("#bDone").onclick = () => openSheet(false); $("#scrim").onclick = () => openSheet(false);
  const full = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.().catch(() => {}); };
  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input,select,textarea")) return;
    if (e.code === "Space") { e.preventDefault(); togglePlay(); }
    else if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); fwd(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); back(); }
    else if (e.key === "r" || e.key === "R") cur().restart();
    else if (["1", "2", "3"].includes(e.key)) { const v = ["reid", "eps", "pareto"][+e.key - 1]; set(v); showScene(v); }
    else if (e.key === "s" || e.key === "S") $("#bSet").click();
    else if (e.key === "f" || e.key === "F") full();
    else if (e.key === "d" || e.key === "D") { const dark = S.theme === "dark" || (S.theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches); setS("theme", dark ? "light" : "dark"); ctrls.theme.set(S.theme); }
    else if (e.key === "Escape") openSheet(false);
  });
  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { document.querySelectorAll(".seg").forEach(segThumb); if (scene === "reid") Reid.relayout(); }, 150); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { if (S.theme === "auto") rebuildAll(); });
  $("#foot").innerHTML = `數字皆讀自 results/tables/（${esc(DATA.generated_at.slice(0, 10))} 產生）。點的位置為示意，數量為實際比對結果。攻擊未成功 ≠ 沒有風險。`;
})();
</script>
